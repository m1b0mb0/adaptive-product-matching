<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Адаптивний пошук товарних пропозицій{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='search.css') }}">
</head>
<body>
  <a href="#main" class="skip">До основного вмісту</a>
  <header class="site-header">
    <div class="shell header-content">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        Адаптивний пошук
      </a>
      <span class="header-note">Локальний каталог</span>
    </div>
  </header>
  <main id="main" class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
